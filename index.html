<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overlay Aki — Kitsune noir & blanc (TikTok portrait)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Cinzel+Decorative:wght@900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@900&text=%E7%8B%90%E9%AD%82%E5%A4%A2%E6%A1%9C&display=swap" rel="stylesheet">
<style>
  :root{
    --nuit:#070707;      /* fond */
    --brume:#ffffff;     /* lueurs et fumée */
    --nacre:#f1f1ef;     /* cadres, fleurs, textes */
    --gris:#8c8c8c;
  }
  html,body{margin:0;padding:0;background:transparent;overflow:hidden;width:100%;height:100%}
  #stage{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0}
  #stage svg{position:absolute;inset:0;width:1080px;height:1920px;overflow:visible}

  .t-titre{font-family:'Cinzel','Trajan Pro','Times New Roman',serif;font-weight:900}
  .t-deco{font-family:'Cinzel Decorative','Cinzel','Times New Roman',serif;font-weight:900}
  .t-kanji{font-family:'Noto Serif JP','Yu Mincho','MS Mincho',serif;font-weight:900}

  .bo{transform-box:fill-box;transform-origin:center}

  /* fumée qui dérive */
  .fumee{animation:fumee var(--d,18s) ease-in-out infinite alternate}
  @keyframes fumee{from{transform:translate(0,0) scale(1)}to{transform:translate(var(--x,60px),var(--y,-40px)) scale(1.25)}}

  /* kanji géants qui apparaissent / disparaissent */
  .kanji{animation:kanji 12s ease-in-out infinite}
  @keyframes kanji{0%,100%{opacity:.03;transform:translateY(20px)}50%{opacity:.11;transform:translateY(-20px)}}

  /* fleurs qui se balancent */
  .fleur{animation:balance var(--d,5s) ease-in-out infinite;animation-delay:var(--r,0s)}
  @keyframes balance{0%,100%{transform:rotate(-8deg) scale(1)}50%{transform:rotate(8deg) scale(1.06)}}

  /* lueur des cadres */
  .halo{animation:halo 3s ease-in-out infinite}
  @keyframes halo{0%,100%{opacity:.35}50%{opacity:.9}}
  .eclat{fill:none;stroke:#fff;stroke-width:7;stroke-linecap:round;stroke-dasharray:.06 .94;animation:tour 5s linear infinite}
  @keyframes tour{to{stroke-dashoffset:-1}}

  /* masque kitsune */
  .kitsune{animation:flotte 5s ease-in-out infinite}
  @keyframes flotte{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-14px) rotate(2deg)}}
  /* avatar */
  .avatar{animation:flotte 5s ease-in-out infinite}
  .sourcils{animation:sourcils 7s ease-in-out infinite}
  @keyframes sourcils{0%,80%,100%{transform:translateY(0)}85%,90%{transform:translateY(-5px)}}
  .meche{transform-box:fill-box;transform-origin:50% 100%;animation:meche 3.5s ease-in-out infinite}
  @keyframes meche{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg) scale(1.02)}}
  .reflet{animation:reflet 4.5s ease-in-out infinite}
  @keyframes reflet{0%,60%{transform:skewX(-25deg) translateX(0)}85%,100%{transform:skewX(-25deg) translateX(220px)}}
  .yeux{animation:yeux 3.2s ease-in-out infinite}
  @keyframes yeux{0%,100%{opacity:.55}50%{opacity:1}}
  .paupiere{animation:cligne 6s infinite}
  @keyframes cligne{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
  .aura{animation:aura 4s ease-in-out infinite}
  @keyframes aura{0%,100%{opacity:.35;transform:scale(.95)}50%{opacity:.75;transform:scale(1.08)}}

  /* nuage AKI */
  .nuage{animation:derive 5s ease-in-out infinite}
  @keyframes derive{0%,100%{transform:translate(0,0) rotate(-2deg) scale(1)}50%{transform:translate(-6px,-10px) rotate(2deg) scale(1.03)}}

  .vague{stroke-dasharray:1 1;stroke-dashoffset:1;animation:vague 7s ease-in-out infinite}
  @keyframes vague{0%{stroke-dashoffset:1}40%,65%{stroke-dashoffset:0}100%{stroke-dashoffset:-1}}
  .spirale{animation:spirale 4s ease-in-out infinite}
  @keyframes spirale{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}
  .etoile{animation:scintille 2.4s ease-in-out infinite}
  @keyframes scintille{0%,100%{opacity:.4;transform:scale(.7) rotate(0)}50%{opacity:1;transform:scale(1.15) rotate(90deg)}}

  .zone-apercu{position:absolute;display:none;align-items:center;justify-content:center;
    background:repeating-linear-gradient(45deg,#2a2a2a 0 22px,#242424 22px 44px);color:#999;
    font:700 34px 'Cinzel',serif;border-radius:18px}
  body.apercu{background:#000}
  body.apercu .zone-apercu{display:flex}
  @media (prefers-reduced-motion:reduce){*{animation-duration:0s!important}}
</style>
</head>
<body>
<div id="stage">
  <div class="zone-apercu" style="left:40px;top:130px;width:1000px;height:562px">Ta caméra ici</div>
  <div class="zone-apercu" style="left:40px;top:770px;width:1000px;height:562px">Ton jeu ici</div>

  <svg viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <mask id="trous" maskUnits="userSpaceOnUse" x="-50" y="-50" width="1180" height="2020">
        <rect x="-50" y="-50" width="1180" height="2020" fill="#fff"/>
        <path class="cadre-jeu" fill="#000"/>
        <path class="cadre-cam" fill="#000"/>
      </mask>

      <filter id="lueur" x="-60%" y="-60%" width="220%" height="220%">
        <feGaussianBlur stdDeviation="5" result="b">
          <animate attributeName="stdDeviation" values="4;9;4" dur="3s" repeatCount="indefinite"/>
        </feGaussianBlur>
        <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="fremit" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="1" result="bruit">
          <animate attributeName="seed" values="1;2;3;4;5" dur="0.6s" repeatCount="indefinite" calcMode="discrete"/>
        </feTurbulence>
        <feDisplacementMap in="SourceGraphic" in2="bruit" scale="4" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <clipPath id="verres">
        <rect x="98" y="148" width="40" height="28" rx="9"/>
        <rect x="142" y="144" width="40" height="28" rx="9"/>
      </clipPath>
      <filter id="flou" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>

      <radialGradient id="gBrume">
        <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
        <stop offset=".5" stop-color="#fff" stop-opacity=".07"/>
        <stop offset="1" stop-color="#fff" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="gAura">
        <stop offset="0" stop-color="#fff" stop-opacity=".7"/>
        <stop offset=".45" stop-color="#fff" stop-opacity=".18"/>
        <stop offset="1" stop-color="#fff" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="gPetale" cx=".5" cy=".85" r=".9">
        <stop offset="0" stop-color="#ffffff"/>
        <stop offset=".6" stop-color="#d9d9d9"/>
        <stop offset="1" stop-color="#7d7d7d"/>
      </radialGradient>
      <linearGradient id="gVisage" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffffff"/>
        <stop offset=".6" stop-color="#d6d6d6"/>
        <stop offset="1" stop-color="#7a7a7a"/>
      </linearGradient>

      <!-- fleur de cerisier -->
      <symbol id="fleur" viewBox="-50 -50 100 100" overflow="visible">
        <g id="p5">
          <path d="M0 -4 C -16 -14 -18 -36 -7 -46 L0 -39 L7 -46 C18 -36 16 -14 0 -4Z" fill="url(#gPetale)"/>
          <path d="M0 -6 L0 -30" stroke="#9a9a9a" stroke-width="1.5" opacity=".6"/>
        </g>
        <use href="#p5" transform="rotate(72)"/>
        <use href="#p5" transform="rotate(144)"/>
        <use href="#p5" transform="rotate(216)"/>
        <use href="#p5" transform="rotate(288)"/>
        <circle r="9" fill="#2a2a2a"/>
        <g fill="#fff"><circle cx="0" cy="-14" r="2.4"/><circle cx="13" cy="-4" r="2.4"/><circle cx="8" cy="11" r="2.4"/><circle cx="-8" cy="11" r="2.4"/><circle cx="-13" cy="-4" r="2.4"/></g>
      </symbol>
      <!-- pétale isolé qui tombe -->
      <symbol id="petale" viewBox="-12 -14 24 28" overflow="visible">
        <path d="M0 13 C -11 6 -12 -8 -4 -13 L0 -9 L4 -13 C12 -8 11 6 0 13Z" fill="url(#gPetale)"/>
      </symbol>
      <!-- étoile croix (comme les ✕ du style) -->
      <symbol id="etoile" viewBox="-10 -10 20 20" overflow="visible">
        <path d="M0 -10 L2 -2 L10 0 L2 2 L0 10 L-2 2 L-10 0 L-2 -2Z" fill="#fff"/>
      </symbol>


    </defs>

    <!-- ===== DÉCOR (percé par les zones jeu / caméra) ===== -->
    <g mask="url(#trous)">
      <rect x="-50" y="-50" width="1180" height="2020" fill="var(--nuit)"/>

      <!-- brume -->
      <ellipse class="fumee" style="--d:16s;--x:80px;--y:40px"   cx="150" cy="200"  rx="420" ry="300" fill="url(#gBrume)"/>
      <ellipse class="fumee" style="--d:20s;--x:-90px;--y:60px"  cx="980" cy="620"  rx="460" ry="340" fill="url(#gBrume)"/>
      <ellipse class="fumee" style="--d:18s;--x:70px;--y:-50px"  cx="300" cy="1100" rx="480" ry="320" fill="url(#gBrume)"/>
      <ellipse class="fumee" style="--d:22s;--x:-60px;--y:-70px" cx="880" cy="1750" rx="520" ry="360" fill="url(#gBrume)"/>
      <ellipse class="fumee" style="--d:17s;--x:50px;--y:30px"   cx="160" cy="1800" rx="380" ry="260" fill="url(#gBrume)"/>

      <!-- kanji géants : 狐 renard · 魂 âme · 夢 rêve · 桜 cerisier -->
      <g fill="none" stroke="#fff" stroke-width="3">
        <text class="t-kanji kanji bo" x="-40" y="330" font-size="380">狐</text>
        <text class="t-kanji kanji bo" x="760" y="1000" font-size="300" style="animation-delay:-4s">魂</text>
        <text class="t-kanji kanji bo" x="-20" y="1700" font-size="340" style="animation-delay:-8s">夢</text>
        <text class="t-kanji kanji bo" x="420" y="1980" font-size="260" style="animation-delay:-2s">桜</text>
      </g>
    </g>

    <!-- ===== CADRE JEU ===== -->
    <path class="cadre-jeu-ext" fill="none" stroke="var(--nacre)" stroke-width="2" opacity=".55"/>
    <g filter="url(#lueur)" class="halo"><path class="cadre-jeu" fill="none" stroke="#fff" stroke-width="6"/></g>
    <path class="cadre-jeu" fill="none" stroke="var(--nacre)" stroke-width="7"/>
    <path class="cadre-jeu eclat" pathLength="1"/>

    <g filter="url(#lueur)">
      <use href="#etoile" class="etoile bo" x="64"  y="88" width="22" height="22"/>
      <text class="t-titre" x="100" y="108" font-size="30" fill="var(--nacre)" letter-spacing="5">CAMÉRA</text>
      <use href="#etoile" class="etoile bo" x="276" y="88" width="22" height="22" style="animation-delay:-1.2s"/>
    </g>

    <!-- ===== CADRE CAMÉRA ===== -->
    <path class="cadre-cam-ext" fill="none" stroke="var(--nacre)" stroke-width="2" opacity=".55"/>
    <g filter="url(#lueur)" class="halo" style="animation-delay:-1.5s"><path class="cadre-cam" fill="none" stroke="#fff" stroke-width="6"/></g>
    <path class="cadre-cam" fill="none" stroke="var(--nacre)" stroke-width="7"/>
    <path class="cadre-cam eclat" pathLength="1" style="animation-delay:-2.5s"/>

    <g filter="url(#lueur)">
      <use href="#etoile" class="etoile bo" x="64"  y="728" width="22" height="22" style="animation-delay:-.6s"/>
      <text class="t-titre" x="100" y="748" font-size="30" fill="var(--nacre)" letter-spacing="5">EN JEU</text>
      <use href="#etoile" class="etoile bo" x="246" y="728" width="22" height="22" style="animation-delay:-1.8s"/>
    </g>

    <!-- ===== BOUQUETS DE FLEURS ===== -->
    <g filter="url(#lueur)">
      <!-- coin bas-gauche du jeu -->
      <use href="#fleur" class="fleur bo" x="-10" y="580" width="130" height="130" style="--d:5s"/>
      <use href="#fleur" class="fleur bo" x="80"  y="630" width="70"  height="70"  style="--d:6s;--r:-2s"/>
      <use href="#fleur" class="fleur bo" x="10"  y="530" width="54"  height="54"  style="--d:4.5s;--r:-1s"/>
      <!-- coin haut-droit de la caméra -->
      <use href="#fleur" class="fleur bo" x="975" y="725" width="105" height="105" style="--d:5.5s;--r:-3s"/>
      <use href="#fleur" class="fleur bo" x="920" y="800" width="58" height="58" style="--d:4.8s;--r:-.5s"/>
      <!-- autour du nuage -->
      <use href="#fleur" class="fleur bo" x="790" y="190" width="60" height="60" style="--d:5.2s;--r:-1.5s"/>
      <!-- autour du masque -->
      <use href="#fleur" class="fleur bo" x="545" y="1520" width="110" height="110" style="--d:5s;--r:-2.5s"/>
      <use href="#fleur" class="fleur bo" x="985" y="1570" width="100" height="100" style="--d:6s;--r:-1s"/>
      <use href="#fleur" class="fleur bo" x="720" y="1380" width="54" height="54" style="--d:4.4s;--r:-3.5s"/>
    </g>

    <!-- ===== AVATAR AKI (tête à cheveux en pointes + lunettes) ===== -->
    <g transform="translate(764 -9) scale(1.1)">
      <ellipse class="aura bo" cx="150" cy="130" rx="190" ry="170" fill="url(#gAura)"/>
      <g class="avatar bo">
        <g filter="url(#lueur)">
          <g filter="url(#fremit)" stroke="#fff" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
            <!-- cheveux en pointes -->
            <path class="meche" fill="#0b0b0b"
              d="M80 176 L42 72 L98 82 L104 42 L128 74 L162 26 L178 76 L260 94 L206 128 L244 188 L200 176 Z"/>
            <!-- tête + frange -->
            <path fill="#0b0b0b"
              d="M92 132 L112 118 L118 132 L132 112 L138 128 L152 110 L160 126 L184 120 C194 132 198 144 198 156 C202 148 212 146 216 154 C222 166 212 180 200 180 C190 202 160 214 130 205 C102 196 88 168 92 132 Z"/>
            <!-- oreille -->
            <path fill="none" stroke-width="4" d="M207 157 Q212 165 204 171"/>
            <!-- sourcils déterminés -->
            <path class="sourcils" fill="none" d="M104 142 L128 151 M152 148 L172 136"/>
            <!-- bouche -->
            <path fill="none" stroke-width="5" d="M128 189 Q140 188 152 187"/>
            <!-- lunettes -->
            <g fill="none" stroke-width="5">
              <rect x="98" y="148" width="40" height="28" rx="9"/>
              <rect x="142" y="144" width="40" height="28" rx="9"/>
              <path d="M138 161 Q140 156 142 159"/>
              <path d="M182 157 L203 156"/>
            </g>
          </g>
          <!-- yeux -->
          <g class="paupiere bo" fill="#fff">
            <ellipse cx="119" cy="163" rx="4.5" ry="5.5"/>
            <ellipse cx="161" cy="159" rx="4.5" ry="5.5"/>
          </g>
        </g>
        <!-- reflet qui passe sur les verres -->
        <g clip-path="url(#verres)">
          <rect class="reflet" x="60" y="130" width="12" height="60" fill="#fff" opacity=".85" transform="skewX(-25)"/>
        </g>
      </g>
    </g>



    <!-- ===== NUAGE + PSEUDO ===== -->
    <!-- ===== NUAGE JAPONAIS + PSEUDO ===== -->
    <g transform="translate(640 1376) scale(1.25)">
      <defs>
        <clipPath id="ecriture">
          <rect x="70" y="70" height="80" width="0">
            <animate attributeName="width" values="0;200;200;0" keyTimes="0;0.14;0.9;1" dur="9s" repeatCount="indefinite"
              calcMode="spline" keySplines=".6 0 .3 1;0 0 1 1;.6 0 .4 1"/>
          </rect>
        </clipPath>
      </defs>
      <ellipse class="aura bo" cx="170" cy="100" rx="210" ry="120" fill="url(#gAura)" opacity=".6"/>
      <g class="nuage bo">
        <!-- traînées de brume sous le nuage -->
        <g fill="none" stroke="var(--nacre)" stroke-linecap="round" filter="url(#lueur)">
          <path class="vague" pathLength="1" stroke-width="4" d="M-10 158 C 50 150 110 166 180 158 S 290 150 345 160"/>
          <path class="vague" pathLength="1" stroke-width="3" style="animation-delay:-2.5s" d="M50 176 C 100 170 150 182 210 175 S 280 170 310 176"/>
        </g>
        <!-- corps du nuage -->
        <g filter="url(#lueur)">
          <path id="corpsNuage" d="M20 130 C 18 110 40 98 60 106 C 58 76 88 58 114 72 C 122 40 160 26 188 44 C 206 24 246 30 254 58 C 282 56 304 80 292 104 C 314 108 320 134 300 142 L 42 142 C 28 142 20 138 20 130 Z"
            fill="#070707" stroke="var(--nacre)" stroke-width="5" stroke-linejoin="round"/>
        </g>
        <use href="#corpsNuage" class="eclat" pathLength="1" fill="none" stroke-width="5" style="animation-duration:6s"/>
        <!-- spirales -->
        <g fill="none" stroke="var(--nacre)" stroke-width="3.5" stroke-linecap="round" filter="url(#lueur)">
          <path class="spirale bo" d="M52.0 110.0 L54.3 110.5 L56.3 111.5 L58.1 112.9 L59.4 114.6 L60.3 116.6 L60.6 118.6 L60.5 120.7 L59.9 122.6 L58.9 124.2 L57.6 125.6 L56.0 126.5 L54.3 127.1 L52.6 127.2 L50.9 126.9 L49.4 126.3 L48.1 125.3 L47.1 124.1 L46.5 122.8 L46.2 121.4 L46.2 120.0 L46.6 118.7 L47.3 117.6 L48.1 116.7 L49.1 116.0 L50.2 115.7 L51.3 115.6 L52.3 115.8 L53.3 116.1 L54.0 116.7 L54.6 117.4 L54.9 118.2 L55.0 119.0 L55.0 119.8 L54.7 120.4 L54.4 121.0 L53.9 121.4 L53.4 121.6 L52.9 121.7 L52.4 121.7 L52.0 121.5"/>
          <path class="spirale bo" style="animation-delay:-1s" d="M170.0 81.0 L174.4 80.0 L178.3 78.0 L181.4 75.1 L183.6 71.5 L184.8 67.5 L184.8 63.5 L183.8 59.7 L181.9 56.4 L179.3 53.8 L176.1 52.1 L172.6 51.2 L169.2 51.4 L166.0 52.4 L163.3 54.1 L161.2 56.5 L159.8 59.2 L159.3 62.1 L159.5 65.0 L160.5 67.6 L162.1 69.7 L164.1 71.3 L166.4 72.3 L168.8 72.6 L171.0 72.3 L173.0 71.4 L174.7 70.0 L175.8 68.4 L176.4 66.5 L176.5 64.7 L176.1 63.0 L175.3 61.6 L174.2 60.5 L172.9 59.8 L171.6 59.6 L170.3 59.7 L169.3 60.1 L168.4 60.7 L167.8 61.5 L167.6 62.4 L167.6 63.2"/>
          <path class="spirale bo" style="animation-delay:-2s" d="M236.0 56.0 L239.4 56.7 L242.5 58.3 L245.0 60.4 L246.8 63.1 L247.9 66.1 L248.2 69.2 L247.7 72.2 L246.5 74.9 L244.7 77.2 L242.5 78.9 L239.9 80.0 L237.3 80.3 L234.7 80.1 L232.4 79.1 L230.4 77.7 L228.9 75.9 L227.9 73.8 L227.5 71.6 L227.7 69.5 L228.3 67.5 L229.5 65.8 L230.9 64.6 L232.6 63.7 L234.3 63.4 L236.0 63.4 L237.6 63.9 L238.9 64.8 L239.9 65.9 L240.5 67.1 L240.8 68.4 L240.8 69.7 L240.4 70.8 L239.8 71.8 L239.0 72.5 L238.1 72.9 L237.2 73.1 L236.4 73.0 L235.7 72.7 L235.1 72.2 L234.8 71.7"/>
          <path class="spirale bo" style="animation-delay:-3s" d="M284.0 122.0 L286.3 121.5 L288.3 120.5 L290.1 119.1 L291.4 117.4 L292.3 115.4 L292.6 113.4 L292.5 111.3 L291.9 109.4 L290.9 107.8 L289.6 106.4 L288.0 105.5 L286.3 104.9 L284.6 104.8 L282.9 105.1 L281.4 105.7 L280.1 106.7 L279.1 107.9 L278.5 109.2 L278.2 110.6 L278.2 112.0 L278.6 113.3 L279.3 114.4 L280.1 115.3 L281.1 116.0 L282.2 116.3 L283.3 116.4 L284.3 116.2 L285.3 115.9 L286.0 115.3 L286.6 114.6 L286.9 113.8 L287.0 113.0 L287.0 112.2 L286.7 111.6 L286.4 111.0 L285.9 110.6 L285.4 110.4 L284.9 110.3 L284.4 110.3 L284.0 110.5"/>
        </g>
        <!-- pseudo -->
        <g clip-path="url(#ecriture)" filter="url(#lueur)">
          <text id="pseudo" class="t-deco" x="170" y="130" font-size="46" text-anchor="middle" fill="#fff" letter-spacing="4">AKI</text>
        </g>
        <use href="#etoile" class="etoile bo" x="300" y="34" width="22" height="22"/>
        <use href="#etoile" class="etoile bo" x="0" y="72" width="16" height="16" style="animation-delay:-1.2s"/>
      </g>
    </g>
  </svg>
</div>

<script>
(function(){
  const params = new URLSearchParams(location.search);
  const PSEUDO = (params.get('pseudo') || 'Aki').toUpperCase();
  if (params.get('apercu') === '1') document.body.classList.add('apercu');
  document.getElementById('pseudo').textContent = PSEUDO;

  // mise à l'échelle (1:1 dans OBS en 1080×1920)
  const stage = document.getElementById('stage');
  const ajuste = () => {
    const s = Math.min(innerWidth/1080, innerHeight/1920);
    stage.style.transform = `translate(${(innerWidth-1080*s)/2}px,0) scale(${s})`;
  };
  addEventListener('resize', ajuste); ajuste();

  // les <use> animés tournent autour de leur propre centre
  document.querySelectorAll('use.bo').forEach(u => {
    const w=+u.getAttribute('width'), h=+u.getAttribute('height');
    const cx=+u.getAttribute('x')+w/2, cy=+u.getAttribute('y')+h/2;
    const g=document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('transform',`translate(${cx} ${cy})`);
    u.parentNode.insertBefore(g,u); g.appendChild(u);
    u.setAttribute('x',-w/2); u.setAttribute('y',-h/2);
    u.classList.remove('bo');
    u.style.transformBox='view-box'; u.style.transformOrigin='0 0';
  });

  // cadres aux bords légèrement bombés
  function cadre(x,y,w,h,b,r){
    return `M${x+r} ${y} Q${x+w/2} ${y-b} ${x+w-r} ${y} Q${x+w} ${y} ${x+w} ${y+r}
      Q${x+w+b} ${y+h/2} ${x+w} ${y+h-r} Q${x+w} ${y+h} ${x+w-r} ${y+h}
      Q${x+w/2} ${y+h+b} ${x+r} ${y+h} Q${x} ${y+h} ${x} ${y+h-r}
      Q${x-b} ${y+h/2} ${x} ${y+r} Q${x} ${y} ${x+r} ${y}Z`;
  }
  const pose = (sel, d) => document.querySelectorAll(sel).forEach(e => e.setAttribute('d', d));
  pose('.cadre-jeu', cadre(40,130,1000,562,12,22));
  pose('.cadre-cam', cadre(40,770,1000,562,12,22));
  pose('.cadre-jeu-ext', cadre(24,114,1032,594,14,30));
  pose('.cadre-cam-ext', cadre(24,754,1032,594,14,30));

})();
</script>
